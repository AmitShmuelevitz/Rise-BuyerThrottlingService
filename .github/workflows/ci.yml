name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (unit, conformance on miniredis, e2e)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Integration (conformance and live e2e on real Redis)
        # Both packages flush the same Redis and share its pub/sub channel,
        # so they run one at a time (-p 1).
        env:
          REDIS_ADDR: localhost:6379
        run: go test -race -count=1 -p 1 ./internal/store/redisstore/ ./internal/e2e/
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Alert rules (promtool unit tests)
        run: make test-alerts
      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchtime 100ms ./internal/throttler/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  demo:
    # Runs the docker-compose demo end to end and checks every buyer's
    # expectations from deploy/scenario.yaml against the live system.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Demo acceptance test
        run: make demo-verify
