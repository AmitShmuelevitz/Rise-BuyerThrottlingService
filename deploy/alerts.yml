# Prometheus alert rules for the throttling service. Loaded by the
# observability profile (docker compose --profile observability up) and
# unit tested with promtool against deploy/alerts_test.yml (make test-alerts).
groups:
  - name: buyer-throttling
    rules:
      - alert: ThrottleStateStale
        # Healthy age is about one window plus the grace period. Three windows
        # means no evaluator has committed for at least two windows.
        expr: throttle_state_age_seconds > 3 * throttle_window_seconds
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Throttle state on {{ $labels.instance }} is {{ $value | humanizeDuration }} old"
          description: >-
            No evaluator has committed new throttle state for three windows. Pods keep
            serving the last state, so bad buyers are not blocked and blocked buyers do
            not recover. Check that an evaluator holds the lease and can reach Redis.

      - alert: ThrottleWindowMismatch
        expr: throttle_config_mismatch == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} uses a different THROTTLE_WINDOW than the evaluator"
          description: >-
            This pod writes stats into windows the evaluator does not read, so its
            traffic is missing from every decision. Set THROTTLE_WINDOW to the same
            value on the evaluator and every pod.

      - alert: ThrottleEvaluatorNoLeader
        # A crashed leader's lease expires within its TTL (15s); longer than a
        # minute without a leader means no replica can take it.
        expr: sum(evaluator_is_leader) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No evaluator replica holds the leader lease"
          description: >-
            Evaluators are running but none is evaluating windows. Check their logs
            for Redis errors.

      - alert: ThrottleEvaluatorFailing
        expr: increase(evaluator_runs_total{outcome="error"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Evaluator {{ $labels.instance }} keeps failing to evaluate windows"
          description: >-
            Window evaluations have been failing for 5 minutes. Missed windows are
            skipped, so throttle state falls behind buyer health.

      - alert: ThrottleStatsDropped
        expr: increase(throttle_stats_dropped_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} dropped buyer stats"
          description: >-
            The pod could not flush stats to Redis for longer than a window and
            dropped them. Decisions for those windows used partial data.
