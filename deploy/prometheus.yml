global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: evaluator
    static_configs:
      - targets: ["evaluator-1:8080", "evaluator-2:8080"]
  - job_name: auction
    static_configs:
      - targets: ["auction-1:8080", "auction-2:8080", "auction-3:8080"]
